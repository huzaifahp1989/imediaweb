# Legacy Netlify config (optional). Primary hosting is Vercel — see vercel.json.
# Functions here re-export handlers from /api for compatibility if you still deploy to Netlify.

[functions]
  node_bundler = "esbuild"

[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/:splat"
  status = 200

[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "20"
