[functions]
  node_bundler = "esbuild"

[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/:splat"
  status = 200

# SPA fallback — existing files in /downloads and get-android.html are served first
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
  force = false

# Ensure Netlify builds the Vite app and publishes from the correct directory
[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "20"

[[headers]]
  for = "/downloads/*.apk"
  [headers.values]
    Content-Type = "application/vnd.android.package-archive"
    Content-Disposition = "attachment; filename=\"islam-media-central.apk\""
